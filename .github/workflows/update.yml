# 4時間ごと (UTC 0, 4, 8, 12, 16, 20 時) に気象データを取り直して docs/ を更新する (GitHub Pages で公開)
# Open-Meteo の無料枠 (1日 10,000 回) に収めるため。内訳は fetch_weather.py の先頭に書いた
name: update weather
on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python fetch_weather.py docs
      - run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "update weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
