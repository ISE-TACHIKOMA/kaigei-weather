# 1時間ごとに気象データを取り直して docs/ を更新する (GitHub Pages で公開)
name: update weather
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python fetch_weather.py docs
      - run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "update weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
